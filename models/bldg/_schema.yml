version: 2

models:
- name: building
  description: PLATEAU の建物。1 行が 1 棟。
  access: public
  columns:
  - name: gml_id
    data_tests: [unique, not_null]
  - name: geometry
    data_tests: [not_null]
  - name: lng
    data_tests: [not_null]
  - name: lat
    data_tests: [not_null]
  - name: source_city_code
    data_tests: [not_null]
- name: building_risk
  description: 建物ごとの災害リスク。1 行が 1 棟 × 1 想定。
  access: public
  columns:
  - name: gml_id
    data_tests: [not_null]
  - name: hazard
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [洪水, 津波, 高潮, 内水, ため池, 土砂災害]
- name: source
  description: 取り込んだ都市の CityGML。1 行が 1 都市。
  access: public
  columns:
  - name: city_code
    data_tests: [unique, not_null]
  - name: page_url
    data_tests: [not_null]
