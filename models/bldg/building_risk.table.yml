schema: bldg
name: building_risk
title: 建物の災害リスク
description: |-
  建物ごとの浸水深と土砂災害警戒区域。1 行が 1 棟 × 1 想定で、gml_id で building とつながる。
  洪水は河川（description）と想定の規模（scale：計画規模・想定最大規模）ごとに 1 行あり、同じ建物に何行も付く。津波・高潮・内水も想定ごとに 1 行。
  土砂災害は、建物が入る区域の種類（description：急傾斜地の崩壊など）と区域（area_type：警戒区域・特別警戒区域）を持つ。
  行が無い建物は「浸水しない」ではなく、その市区町村のデータに想定が載っていないことがある。どの想定が載っているかは市区町村によって違う。

  出典：「3D都市モデル（Project PLATEAU）」（国土交通省、各地方公共団体）。Queria が CityGML の建物の災害リスク属性を読んで作成した。
sources:
  - path: https://www.geospatial.jp/ckan/dataset/plateau
fields:
  - name: gml_id
    title: 建物の GML ID
    description: building の gml_id
  - name: city_code
    title: 市区町村コード（5 桁）
    semantic: { role: entity, name: city }
  - name: lg_code
    title: 全国地方公共団体コード
    semantic: { role: entity, name: city }
  - name: hazard
    title: 災害の種類
    description: 洪水・津波・高潮・内水・ため池・土砂災害
    semantic: { role: dimension }
  - name: description
    title: 想定の名前
    description: 洪水は河川の名前（多摩川水系多摩川など）、土砂災害は現象の種類
    semantic: { role: dimension }
  - name: admin_type
    title: 河川の管理者
    description: 国・都道府県
  - name: scale
    title: 想定の規模
    description: 計画規模（L1）・想定最大規模（L2）
    semantic: { role: dimension }
  - name: rank
    title: 浸水ランク
    description: 0.5m 未満・0.5m 以上 3m 未満など
    semantic: { role: dimension }
  - name: rank_code
    title: 浸水ランクのコード
  - name: rank_org
    title: 浸水ランク（独自区分）
    description: 都道府県が独自の区分で作ったときの浸水ランク
  - name: depth
    title: 浸水深（m）
  - name: duration
    title: 浸水継続時間（時間）
  - name: area_type
    title: 土砂災害の区域
    description: 土砂災害警戒区域・土砂災害特別警戒区域
    semantic: { role: dimension }
