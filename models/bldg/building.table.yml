schema: bldg
name: building
title: 建物
description: |-
  PLATEAU の建物。1 行が 1 棟。外形（LOD0 の平面の形）と、計測高さ・階数・用途などの属性を持つ。外形を measured_height で押し出すと LOD1 の立体になる。
  属性の多くは都市計画基礎調査から来ていて、どの項目が入っているかは市区町村によって違う。用途・高さはほぼすべての市区町村にあり、住所・建築年・延べ面積・構造は一部にしか無い。
  住所は町丁目まで（「東京都日野市旭が丘一丁目」）で、番地は入っていない。
  市区町村のデータは 3 次メッシュの単位で作られていて、境のメッシュには隣の市区町村の建物も入っている。同じ建物は 1 行にまとめ、隣の市区町村が自分のデータを持っているときはそちらの建物を使う。
  small_area_code・machiaza_id は外形の上の代表点（lng / lat）が入る小地域と町字。

  出典：「3D都市モデル（Project PLATEAU）」（国土交通省、各地方公共団体）。市区町村ごとのデータセットのページ URL は source にある。Queria が CityGML の建物を読み、1 棟 1 行にして作成した。
primary_key: [gml_id]
sources:
  - path: https://www.geospatial.jp/ckan/dataset/plateau
fields:
  - name: gml_id
    title: 建物の GML ID
    description: CityGML の gml:id。PLATEAU が配る 3D Tiles・MVT の地物の gml_id と同じで、PLATEAU の表示用データとこの値でつなげる
  - name: building_id
    title: 建物 ID
    description: PLATEAU の建物 ID（13212-bldg-17683 のような形）。市区町村の中で一意
  - name: city_code
    title: 市区町村コード（5 桁）
    description: 建物がある市区町村。原典の値で、無いときは町字から
    extensions: { queria: { semantic: { role: entity, name: city } } }
  - name: lg_code
    title: 全国地方公共団体コード
    description: city_code に検査数字を付けた 6 桁
    extensions: { queria: { semantic: { role: entity, name: city } } }
  - name: prefecture_code
    title: 都道府県コード
    extensions: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: class
    title: 建物の種類
    description: 普通建物・堅ろう建物など
    extensions: { queria: { semantic: { role: dimension } } }
  - name: usage
    title: 用途
    description: 住宅・共同住宅・商業施設・業務施設・工場など。わからないものは「不明」
    extensions: { queria: { semantic: { role: dimension } } }
  - name: usage_code
    title: 用途のコード
    description: 製品仕様書の符号（411 が住宅など）
  - name: detailed_usage
    title: 詳細用途
    description: 都市計画基礎調査の建物用途（独立住宅など）
    extensions: { queria: { semantic: { role: dimension } } }
  - name: measured_height
    title: 計測高さ（m）
    description: 航空測量などで測った、地面から建物の最も高い所までの高さ
  - name: storeys_above_ground
    title: 地上階数
  - name: storeys_below_ground
    title: 地下階数
  - name: year_of_construction
    title: 建築年
    description: 一部の市区町村だけ
  - name: total_floor_area
    title: 延べ面積（m²）
    description: 一部の市区町村だけ
  - name: footprint_area
    title: 建築面積（m²）
    description: 原典の建築面積。無いときは屋根の外周の面積
  - name: structure
    title: 構造
    description: 木造・鉄骨造・鉄筋コンクリート造など。一部の市区町村だけ
    extensions: { queria: { semantic: { role: dimension } } }
  - name: fireproof_structure
    title: 耐火構造の種別
    description: 耐火・準耐火・その他
    extensions: { queria: { semantic: { role: dimension } } }
  - name: survey_year
    title: 調査年
    description: 属性のもとになった都市計画基礎調査の年
  - name: address
    title: 住所
    description: 町丁目まで。番地は入っていない。一部の市区町村だけ
  - name: real_estate_id
    title: 不動産 ID（建物）
    description: 不動産 ID の実証に参加した市区町村だけ
  - name: land_real_estate_ids
    title: 不動産 ID（土地）
    description: 建物が建つ土地の不動産 ID の配列
  - name: lod
    title: 詳細度（LOD）
    description: 原典が持ついちばん細かい立体の詳細度。1 は箱、2 は屋根の形まで、3 は窓や扉まで。この表が持つのは外形だけ
  - name: attributes
    title: 汎用属性
    description: 市区町村が独自に足した属性（gen:*Attribute）の名前 → 値の対応
  - name: small_area_code
    title: 小地域コード
    description: 代表点が入る国勢調査の小地域（e_stat の boundary.small_area の key_code）
    extensions: { queria: { semantic: { role: entity, name: small_area } } }
  - name: machiaza_id
    title: 町字 ID
    description: 代表点が入る町字（japan_address_code の town_shape）。lg_code との組でアドレス・ベース・レジストリの町字を指す
    extensions: { queria: { semantic: { role: entity, name: town } } }
  - name: lng
    title: 経度
    description: 外形の上の代表点（ST_PointOnSurface）
  - name: lat
    title: 緯度
  - name: mesh3
    title: 3 次メッシュコード
    description: 代表点が入る JIS X 0410 の 3 次メッシュ（約 1km 四方）
    extensions: { queria: { semantic: { role: entity, name: mesh } } }
  - name: geometry
    title: 外形
    description: LOD0 の平面の形（経度・緯度、JGD2011）。原典に LOD0 が無いときは LOD1 の立体の底面
  - name: source_city_code
    title: 取り込んだデータの市区町村コード
    description: この建物を読んだ PLATEAU のデータの市区町村。source の city_code
  - name: source_year
    title: データの年度
  - name: file
    title: 原典のファイル
    description: CityGML のファイル名（3 次メッシュごと）
