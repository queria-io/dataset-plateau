name: Check upstream

# 全国の取り込みは重いので自動では回さない (README の「ビルド」)。
# ここは PLATEAU のデータカタログと公開中の source を比べ、取り込み直しが要れば Discord に知らせる
on:
  schedule:
    - cron: "0 19 * * 1" # 毎週火曜 04:00 JST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
      - id: check
        run: echo "changed=$(uv run --no-project --with duckdb==1.5.6 python scripts/check_upstream.py | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - name: Notify Discord
        if: steps.check.outputs.changed != ''
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANGED: ${{ steps.check.outputs.changed }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          payload=$(jq -n --arg repo "${{ github.repository }}" --arg url "${{ github.server_url }}/${{ github.repository }}" --arg changed "$CHANGED" \
            '{embeds: [{title: "Rebuild needed", url: $url, color: 15105570, fields: [{name: "Repository", value: $repo}, {name: "Updated upstream", value: ($changed | .[0:1000])}]}]}')
          curl -s -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
