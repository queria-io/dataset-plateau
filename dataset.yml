# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
name: plateau
title: PLATEAU 3D 都市モデルの建物
description: |-
  国土交通省の PLATEAU（3D 都市モデル）の建物です。PLATEAU が整備した市区町村の建物を 1 棟ずつ、外形・高さ・階数・用途と、浸水深などの災害リスクとともに収録しています。

  出典：「3D都市モデル（Project PLATEAU）」（国土交通省、各地方公共団体）。市区町村ごとのページ URL は bldg.source にあります。Queria が加工したものです。
keywords:
  - PLATEAU
  - 3D都市モデル
  - 建物
  - 建築物
  - 高さ
  - 階数
  - 用途
  - 浸水深
  - 洪水
  - CityGML
  - 国土交通省
homepage: https://github.com/queria-io/dataset-plateau
language: ja

licenses:
  - CC-BY-4.0

sources:
  - title: 3D都市モデル（Project PLATEAU）ポータルサイト
    path: https://www.geospatial.jp/ckan/dataset/plateau
  - title: PLATEAU サイトポリシー
    path: https://www.mlit.go.jp/plateau/site-policy/

contributors:
  - title: 国土交通省
    path: https://www.mlit.go.jp/plateau/
    roles: [rightsHolder]

spatial_coverage: [JP]
update_frequency: irregular

schemas:
  - name: bldg
    title: 建築物

annotations:
  queria:
    themes: [housing_land, justice_safety_environment]
    cover: 🏙️
