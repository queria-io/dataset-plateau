spec_version: "0.1"
name: plateau
title: PLATEAU 3D 都市モデルの建物
description: |-
  国土交通省の PLATEAU（3D 都市モデル）の建物。1 行が 1 棟で、外形（LOD0）・計測高さ・地上と地下の階数・用途・構造・建築年・延べ面積・住所（町丁目まで）を持つ。外形を高さで押し出すと LOD1 の立体になる。
  建物ごとの浸水深や土砂災害警戒区域に入るかも別の表に持つ。洪水・津波・高潮・内水は河川や想定の規模ごとに 1 行。
  外形の上の代表点から、国勢調査の小地域コード（e_stat）、町字 ID（japan_address_code）、3 次メッシュコードを付けてあるので、人口や地価など地域の数字と結べる。
  PLATEAU が整備した市区町村（2026 年 11 月時点で 305）だけを収録する。どの項目が入っているかは市区町村によって違い、住所・建築年・延べ面積・構造などは一部の市区町村にしか無い。年度も市区町村ごとに違い（2020〜2025 年度）、source に市区町村ごとの年度がある。

  出典：「3D都市モデル（Project PLATEAU）」（国土交通省、各地方公共団体）（G空間情報センター、https://www.geospatial.jp/ckan/dataset/plateau ）。市区町村ごとのデータセットのページ URL は bldg.source の page_url にある。
  Queria が CityGML の建物を読み、1 棟 1 行の表にして、市区町村の境で重なる建物を 1 つにまとめ、小地域・町字・メッシュのコードを付けて作成した。国土交通省や地方公共団体が作成したものではない。
